---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contamination-gauge-config 
  namespace: default
data:
  API_KEYS: "test-key-123"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: contamination-gauge-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contamination-gauge-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contamination-gauge-api
  template: 
    metadata:
      labels: 
        app: contamination-gauge-api
    spec:
      containers:
      - name: fastapi-app
        image: contamination-gauge:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env: 
        - name: API_KEYS
          valueFrom:
            configMapKeyRef:
              name: contamination-gauge-config
              key: API_KEYS
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: contamination-gauge-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          value: "sqlite:////data/contamination_gauge.db"
        volumeMounts:
        - name: database-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits: 
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10 
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready 
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes: 
      - name: database-storage
        persistentVolumeClaim:
          claimName: contamination-gauge-db-pvc
---
apiVersion: v1
kind: Service 
metadata:
  name: contamination-gauge-service
  namespace: default
spec:
  selector:
    app: contamination-gauge-api
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
    name: http

